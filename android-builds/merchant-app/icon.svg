<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="merchantBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#merchantBg)"/>
  
  <!-- Store Icon -->
  <g transform="translate(136, 120)">
    <!-- Roof -->
    <path d="M0 60 L120 0 L240 60 L240 220 L0 220 Z" fill="white" opacity="0.95"/>
    
    <!-- Door -->
    <rect x="90" y="130" width="60" height="90" rx="5" fill="#059669"/>
    
    <!-- Windows -->
    <rect x="30" y="80" width="40" height="40" rx="3" fill="#059669"/>
    <rect x="170" y="80" width="40" height="40" rx="3" fill="#059669"/>
  </g>
  
  <!-- Text: تاجر السند -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="56" font-weight="bold" 
        fill="white" text-anchor="middle">تاجر السند</text>
</svg>
