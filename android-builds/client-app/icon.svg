<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="clientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97706"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#clientBg)"/>
  
  <!-- Shopping Bag Icon -->
  <g transform="translate(136, 130)">
    <!-- Bag body -->
    <rect x="0" y="60" width="240" height="180" rx="15" fill="white" opacity="0.95"/>
    
    <!-- Handle -->
    <path d="M70 60 Q70 0 120 0 Q170 0 170 60" fill="none" stroke="white" 
          stroke-width="12" stroke-linecap="round" opacity="0.95"/>
    
    <!-- Sparkle -->
    <circle cx="180" cy="40" r="15" fill="white" opacity="0.95"/>
    <circle cx="200" cy="80" r="10" fill="white" opacity="0.95"/>
  </g>
  
  <!-- Text: سند -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="72" font-weight="bold" 
        fill="white" text-anchor="middle">سـنـد</text>
</svg>
