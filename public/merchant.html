<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تاجر السند - نقطة البيع والمخزون</title>
    <meta name="description" content="تطبيق التاجر لنقاط البيع وإدارة المخزون" />
    <link rel="manifest" href="/merchant-manifest.json" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="تاجر السند" />
    <link rel="apple-touch-icon" href="/assets/originals/sanad-icon-1024.png" />
    <link rel="icon" type="image/png" href="/assets/originals/sanad-icon-1024.png" />
    <script>
      window.SANAD_APP_TYPE = 'merchant';
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('✅ SW registered: ', registration);
          }).catch((registrationError) => {
            console.log('❌ SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
